[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caps-spatial"
version = "0.1.0"
description = "CAPS: composition-adjusted programme scores for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Xindi Wei" }]
keywords = ["spatial transcriptomics", "Visium", "composition", "gene programme", "Moran"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "anndata>=0.8",
    "h5py>=3.0",
]

[project.scripts]
caps = "caps_spatial.cli:main"

[project.urls]
Homepage = "https://github.com/clyty019/caps_spatial"
Repository = "https://github.com/clyty019/caps_spatial"
Issues = "https://github.com/clyty019/caps_spatial/issues"

[tool.setuptools.packages.find]
where = ["src"]
